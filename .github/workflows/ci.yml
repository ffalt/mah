name: ci

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false
      - run: npm ci
      - run: npm run test
      - run: npm run build:prod
